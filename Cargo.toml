[package]
name = "claude-pretool-hook"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
path-clean = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.23"

[dev-dependencies]
duct = "0.13"
tempfile = "3"
